<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="210mm" height="297mm" role="img" aria-label="Sequence diagram in four columns: developer or admin, GovernorConnector, Camunda Console, SaaS cluster. The admin creates the GOVERNOR_PRICE_TABLE cluster secret and an API client, the connector runtime signs in and opens a job stream to the cluster, and for each Token cost task it reads the secret from the Console, prices the tokens and completes the job." font-family="Segoe UI, Helvetica, Arial, sans-serif">
