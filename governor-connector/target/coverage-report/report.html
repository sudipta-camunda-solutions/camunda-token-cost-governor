  "definitions" : {
    "ai-agent-task-cost-tracking" : "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\r\n<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:bpmndi=\"http://www.omg.org/spec/BPMN/20100524/DI\" xmlns:dc=\"http://www.omg.org/spec/DD/20100524/DC\" xmlns:di=\"http://www.omg.org/spec/DD/20100524/DI\" xmlns:modeler=\"http://camunda.org/schema/modeler/1.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\" exporter=\"Camunda Web Modeler\" exporterVersion=\"63e7f30\" expressionLanguage=\"http://www.w3.org/1999/XPath\" id=\"Definitions_AiAgentTaskCostTracking\" modeler:executionPlatform=\"Camunda Cloud\" modeler:executionPlatformVersion=\"8.9.0\" targetNamespace=\"http://bpmn.io/schema/bpmn\" typeLanguage=\"http://www.w3.org/2001/XMLSchema\">\r\n    \r\n  <bpmn:error errorCode=\"PRICE_NOT_FOUND\" id=\"Error_PriceNotFound\" name=\"Price not found\"/>\r\n    \r\n  <!--\n    Activity_AiAgentTask is a REAL io.camunda.connectors.agenticai.aiagent.v1 element (not a\n    placeholder), wired to Camunda's provided LLM endpoint (CAMUNDA_PROVIDED_LLM_API_ENDPOINT/\n    _API_KEY secrets) calling anthropic.claude-haiku-4-5. Its result variable is \"agent\".\n\n    Token usage is at agent.context.metrics.tokenUsage.{inputTokenCount, outputTokenCount}\n    (plus agent.context.metrics.modelCalls) - read from a real process instance on a live\n    cluster (AI Agent element template v7, openaiCompatible provider); it does NOT need \"Include\n    assistant message\". An earlier version of this file, the README and the tests used\n    agent.responseMessage.metadata.framework.tokenUsage, which does not exist on that result:\n    the Token cost job then failed validation with \"inputTokens: must not be null\".\n\n    The connector's \"Agent name\" input is called agentName, NOT agent: the AI Agent Task's default\n    result variable is \"agent\", and an input mapping of the same name shadows it for the token\n    mappings that follow it (Zeebe applies input mappings in order, each visible to the next).\n\n    Deliberately a single straight-line pass (Start -> AI Agent Task -> Token cost -> Done), not a\n    loop: an earlier version of this file had a \"continue looping?\" gateway looping back to\n    Activity_AiAgentTask, but a real AI Agent Task has no \"continueLoop\" concept of its own (it\n    runs its own internal tool-call loop up to data.limits.maxModelCalls and completes once), so\n    that loop-back could never actually fire - continueLoop was always undefined, and Modeler's\n    own linter flags a task with multiple incoming sequence flows and no explicit join as an error\n    (\"Incoming flows do not join\") regardless. If you want to chain multiple AI Agent Task\n    activations of your own, reintroduce a loop-back edge and gateway explicitly, driven by\n    whatever real signal decides to continue - not by this file's old vestigial pattern.\n\n    WHY THE business_ PREFIX: on Camunda 8.10 SaaS clusters the default Optimize data filter exports\n    only variables whose names start with \"business_\". Without the prefix Optimize never sees the\n    totals (its report builder shows the Variable view as unavailable) and the variables are never\n    back-filled. business_totalCostUsd (USD) / business_totalCost (whole micro-dollars,\n    1,000,000 = 1 USD) are the running totals,\n    business_costAgent is the agent name of the last Token cost call (a plain string, because\n    Optimize does not flatten the tokenCostResult object on SaaS), and business_taskAgentCost is\n    this agent's own cost in whole micro-dollars (the same figure as business_totalCost here; it\n    exists so Optimize can show a cost tile per agent, next to the sub-process demo's agents).\n    business_taskAgentInputTokens / OutputTokens / TotalTokens are this agent's tokens, copied\n    from tokenCostResult so Optimize can show them per agent.\n    The Prometheus counters and the\n    connector's own tokenCostResult are unaffected. See optimize/ai-cost-dashboard.json.\n\n    OPERATIONAL GOTCHA, hit once already: if you re-apply/update the \"Token Cost Reporter\"\n    element template on Activity_TokenCost in Modeler (e.g. after a version bump), Modeler\n    regenerates that task's ENTIRE zeebe:ioMapping from the template's own known fields only -\n    silently deleting the eight zeebe:output lines below (tokenCostResult, business_totalCost,\n    business_totalCostUsd, business_costAgent, business_taskAgentCost and the three\n    business_taskAgent...Tokens variables) that aren't part of the template's own field set,\n    since they were added by hand. If the totals stop accumulating after touching this task in\n    Modeler, this is why - re-add those eight output lines afterward.\n  -->\r\n    \r\n  <bpmn:process id=\"ai-agent-task-cost-tracking\" isClosed=\"false\" isExecutable=\"true\" name=\"AI Agent Task with token/cost tracking\" processType=\"None\">\r\n        \r\n    <bpmn:startEvent id=\"StartEvent_1\" isInterrupting=\"true\" name=\"Start\" parallelMultiple=\"false\">\r\n            \r\n      <bpmn:extensionElements>\r\n                \r\n        <zeebe:ioMapping>\r\n                    \r\n          <zeebe:output source=\"=0\" target=\"business_totalCost\"/>\r\n                    \r\n          <zeebe:output source=\"=0\" target=\"business_totalCostUsd\"/>\r\n                  \r\n        </zeebe:ioMapping>\r\n              \r\n      </bpmn:extensionElements>\r\n            \r\n      <bpmn:outgoing>Flow_StartToAgent</bpmn:outgoing>\r\n          \r\n    </bpmn:startEvent>\r\n        \r\n    <bpmn:serviceTask completionQuantity=\"1\" id=\"Activity_AiAgentTask\" implementation=\"##WebService\" isForCompensation=\"false\" name=\"AI Agent Task\" startQuantity=\"1\" zeebe:modelerTemplate=\"io.camunda.connectors.agenticai.aiagent.v1\" zeebe:modelerTemplateIcon=\"data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9I ory.contextWindowSize\"/>\r\n                    \r\n          <zeebe:input source=\"=10\" target=\"data.limits.maxModelCalls\"/>\r\n                    \r\n          <zeebe:input source=\"text\" target=\"data.response.format.type\"/>\r\n                    \r\n          <zeebe:input source=\"=false\" target=\"data.response.format.parseJson\"/>\r\n                    \r\n          <zeebe:input source=\"=true\" target=\"data.response.includeAssistantMessage\"/>\r\n                  \r\n        </zeebe:ioMapping>\r\n                \r\n        <zeebe:taskHeaders>\r\n                    \r\n          <zeebe:header key=\"elementTemplateVersion\" value=\"7\"/>\r\n                    \r\n          <zeebe:header key=\"elementTemplateId\" value=\"io.camunda.connectors.agenticai.aiagent.v1\"/>\r\n                    \r\n          <zeebe:header key=\"resultVariable\" value=\"agent\"/>\r\n                    \r\n          <zeebe:header key=\"retryBackoff\" value=\"PT0S\"/>\r\n                  \r\n        </zeebe:taskHeaders>\r\n              \r\n      </bpmn:extensionElements>\r\n            \r\n      <bpmn:incoming>Flow_StartToAgent</bpmn:incoming>\r\n            \r\n      <bpmn:outgoing>Flow_AgentToTokenCost</bpmn:outgoing>\r\n          \r\n    </bpmn:serviceTask>\r\n        \r\n    <bpmn:serviceTask completionQuantity=\"1\" id=\"Activity_TokenCost\" implementation=\"##WebService\" isForCompensation=\"false\" name=\"Token cost\" startQuantity=\"1\" zeebe:modelerTemplate=\"io.github.camunda.TokenCostGovernor.v2\" zeebe:modelerTemplateIcon=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiIgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIj4KICA8cGF0aCBkPSJNMTYgMiBMMjggNyBWMTUgQzI4IDIyLjUgMjIuOCAyNy44IDE2IDMwIEM5LjIgMjcuOCA0IDIyLjUgNCAxNSBWNyBaIgogICAgICAgIGZpbGw9IiMwZjc2NmUiIHN0cm9rZT0iIzEzNGU0YSIgc3Ryb2tlLXdpZHRoPSIxIi8+CiAgPHBhdGggZD0iTTE2IDIgTDI4IDcgVjE1IEMyOCAyMi41IDIyLjggMjcuOCAxNiAzMCBaIiBmaWxsPSIjMTRiOGE2IiBvcGFjaXR5PSIwLjM1Ii8+CiAg          \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNShape bpmnElement=\"Activity_LogUnknownModelPrice\" id=\"Activity_LogUnknownModelPrice_di\">\r\n                \r\n        <dc:Bounds height=\"80\" width=\"100\" x=\"440\" y=\"360\"/>\r\n              \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNShape bpmnElement=\"EndEvent_Done\" id=\"EndEvent_Done_di\">\r\n                \r\n        <dc:Bounds height=\"36\" width=\"36\" x=\"602\" y=\"222\"/>\r\n              \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNShape bpmnElement=\"EndEvent_UnknownModelPrice\" id=\"EndEvent_UnknownModelPrice_di\">\r\n                \r\n        <dc:Bounds height=\"36\" width=\"36\" x=\"602\" y=\"382\"/>\r\n              \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNShape bpmnElement=\"BoundaryEvent_PriceNotFound\" id=\"BoundaryEvent_PriceNotFound_di\">\r\n                \r\n        <dc:Bounds height=\"36\" width=\"36\" x=\"472\" y=\"262\"/>\r\n              \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_TokenCostToDone\" id=\"Flow_TokenCostToDone_di\">\r\n                \r\n        <di:waypoint x=\"540\" y=\"240\"/>\r\n                \r\n        <di:waypoint x=\"602\" y=\"240\"/>\r\n              \r\n      </bpmndi:BPMNEdge>\r\n            \r\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_StartToAgent\" id=\"Flow_StartToAgent_di\">\r\n                \r\n        <di:waypoint x=\"188\" y=\"240\"/>\r\n                \r\n        <di:waypoint x=\"280\" y=\"240\"/>\r\n              \r\n      </bpmndi:BPMNEdge>\r\n            \r\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_AgentToTokenCost\" id=\"Flow_AgentToTokenCost_di\">\r\n                \r\n        <di:waypoint x=\"380\" y=\"240\"/>\r\n                \r\n        <di:waypoint x=\"440\" y=\"240\"/>\r\n              \r\n      </bpmndi:BPMNEdge>\r\n            \r\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_Bounda     "ai-agent-subprocess-cost-tracking" : "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\r\n<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:bpmndi=\"http://www.omg.org/spec/BPMN/20100524/DI\" xmlns:dc=\"http://www.omg.org/spec/DD/20100524/DC\" xmlns:di=\"http://www.omg.org/spec/DD/20100524/DI\" xmlns:modeler=\"http://camunda.org/schema/modeler/1.0\" xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\" exporter=\"Camunda Web Modeler\" exporterVersion=\"f38b97d\" expressionLanguage=\"http://www.w3.org/1999/XPath\" id=\"Definitions_AiAgentSubprocessCostTracking\" modeler:executionPlatform=\"Camunda Cloud\" modeler:executionPlatformVersion=\"8.9.0\" targetNamespace=\"http://bpmn.io/schema/bpmn\" typeLanguage=\"http://www.w3.org/2001/XMLSchema\">\r\n    \r\n  <bpmn:process id=\"ai-agent-subprocess-cost-tracking\" isClosed=\"false\" isExecutable=\"true\" name=\"AI Agent Sub-process with token/cost tracking\" processType=\"None\">\r\n        \r\n    <bpmn:documentation textFormat=\"text/plain\">Token Cost Reporter demo with two REAL AI Agent Sub-process elements (ad-hoc sub-process, template io.camunda.connectors.agenticai.aiagent.jobworker.v1, job type io.camunda.agenticai:aiagent-job-worker:1), each followed by its own Token cost task.\r\n\r\nResearch Analyst (big context): long system prompt and a long claim brief, context window 100, up to 10 model calls, uses its date tool, so it makes several model calls and re-sends a large context each time - a lot of input tokens. Quick Answer (small context): one-line system prompt, one short question, context window 4, up to 2 model calls, no tool call - a handful of tokens. Token cost prices each call as anthropic / claude-haiku-4-5 under the agent names research-analyst and quick-answer (the Prometheus label agent).\r\n\r\nWhere the tokens are: when an AI Agent Sub-process finishes, its job sets the variable agent (the sub-process output mapping =agent copies it to the process). It only contains context when Include agent context (data.response.includeAgentContext) is true, so both sub-processes set it. Then agent.context.metrics.tokenUsage.inputTokenCount / outputTokenCount is the total over ALL model calls of that sub-process (agent.context.metrics.modelCalls counts them). Nothing is hard-coded in the Token cost tasks: each reads its own agent result.\r\n\r\nZeebe refuses to deploy an ad-hoc sub-process with no activity, so each agent contains one tool (a script task); replace it with your own tools. The Token cost input for the agent label is called agentName, not agent: the sub-process result variable is agent and an input of that name would shadow it.\r\n\r\nbusiness_ prefix: on Camunda 8.10 SaaS the default Optimize data filter exports only variables named business_*. business_totalCostUsd (USD) and business_totalCost (whole micro-dollars) are running totals across both calls; business_costAgent lists the agent names of every Token cost call, comma separated (\"research-analyst, quick-answer\"), and tokenCostResult holds the LAST call (Quick Answer). Each Token cost task also writes its own agent's cost to a variable of its own, business_researchAnalystCost and business_quickAnswerCost, because Optimize reads one variable per report and would otherwise show only the last agent. Like business_totalCost these are whole micro-dollars (1,000,000 = 1 USD), not USD, and their names carry no unit: Zeebe exports a decimal below 0.001 as 7.77E-4, which is what Optimize's table would print, and Optimize rounds its number tiles to 3 decimals. The same task also writes that agent's tokens: business_researchAnalystInputTokens / OutputTokens / TotalTokens and business_quickAnswerInputTokens / OutputTokens / TotalTokens, copied from tokenCostResult (the agent's total over all its model calls; total = input + output), so Optimize can show them per agent. The Prometheus counters also carry the per-agent split. See optimize/ai-cost-dashboard -subprocess.json.\r\n\r\nGotcha: applying or updating the Token Cost Reporter element template on a Token cost task in Modeler regenerates its whole input/output mapping and deletes the eight output lines (tokenCostResult, business_totalCost, business_totalCostUsd, business_costAgent, the task's per-agent cost variable, business_researchAnalystCost or business_quickAnswerCost, and its three token variables, business_researchAnalystInputTokens / OutputTokens / TotalTokens or business_quickAnswerInputTokens / OutputTokens / TotalTokens). Re-add them.</bpmn:documentation>\r\n        \r\n    <bpmn:startEvent id=\"StartEvent_1\" isInterrupting=\"true\" name=\"Start\" parallelMultiple=\"false\">\r\n            \r\n      <bpmn:extensionElements>\r\n                \r\n        <zeebe:ioMapping>\r\n                    \r\n          <zeebe:output source=\"=0\" target=\"business_totalCost\"/>\r\n                    \r\n          <zeebe:output source=\"=0\" target=\"business_totalCostUsd\"/>\r\n                    \r\n          <zeebe:output source=\"=&quot;&quot;\" target=\"business_costAgent\"/>\r\n                  \r\n        </zeebe:ioMapping>\r\n              \r\n      </bpmn:extensionElements>\r\n            \r\n      <bpmn:outgoing>Flow_1px4rdd</bpmn:outgoing>\r\n          \r\n    </bpmn:startEvent>\r\n        \r\n    <bpmn:endEvent id=\"EndEvent_Done\" name=\"Done\">\r\n            \r\n      <bpmn:incoming>Flow_0qo53nk</bpmn:incoming>\r\n          \r\n    </bpmn:endEvent>\r\n        \r\n    <bpmn:adHocSubProcess cancelRemainingInstances=\"true\" completionQuantity=\"1\" id=\"Activity_1kyv3gj\" isForCompensation=\"false\" name=\"Research Analyst (big context)\" startQuantity=\"1\" triggeredByEvent=\"false\" zeebe:modelerTemplate=\"io.camunda.connectors.agenticai.aiagent.jobworker.v1\" zeebe:modelerTemplateIcon=\"data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAzMiAzMiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0 0;CASE NOTES&#10;Claim ID: CLM-2026-004417. Policy holder: Jordan Meyer, home contents policy HC-77120, active since 2021-03-14, annual premium 612 USD, excess 250 USD.&#10;Loss reported: 2026-09-02 by phone. Incident date: 2026-08-29 (burst pipe in the upstairs bathroom while the holder was away).&#10;Claimed items: 1 laptop (3,200 USD), 1 sofa (1,850 USD), 1 rug (900 USD), 6 dining chairs (1,140 USD), 1 television (1,300 USD). Total claimed: 8,390 USD.&#10;Evidence received: 14 photos of the water damage, a plumber's invoice for the repair (480 USD), receipts for the laptop and the television, no receipts for the sofa, the rug or the chairs.&#10;Neighbour statement: the flat below reports a water stain on the ceiling from 2026-08-30.&#10;History: two earlier claims on this policy, both paid: 2022 (stolen bicycle, 640 USD) and 2024 (broken window, 410 USD).&#10;&#10;GUIDELINES&#10;G1. Water damage from a sudden pipe burst is covered; gradual leaks and wear are not.&#10;G2. Items over 1,000 USD need proof of ownership such as a receipt, a bank statement or a warranty card.&#10;G3. Items under 1,000 USD can be accepted with photos of the damaged item alone.&#10;G4. Claims above 5,000 USD need a second reviewer.&#10;G5. The holder must report the loss within 14 days of the incident.&#10;G6. Depreciation of 10 percent per year applies to furniture and 20 percent per year to electronics, capped at 70 percent.&#10;&#10;Please check each claimed item against G1 to G6, calculate the payable amount before the excess, and say what you still need from the holder.&quot;\" target=\"data.userPrompt.prompt\"/>\r\n                    \r\n          <zeebe:input target=\"agentContext\"/>\r\n                    \r\n          <zeebe:input source=\"in-process\" target=\"data.memory.storage.type\"/>\r\n                    \r\n          <zeebe:input source=\"=100\" target=\"data.memory.contextWindowSize\"/>\r\n                    \r\n          <zeebe:input source=\"=10\" target=\"data.li
