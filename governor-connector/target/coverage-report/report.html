  "definitions" : {
    "ai-agent-task-cost-tracking" : "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\r\n<bpmn:definitions xmlns:bpmn=\"http://www.omg.org/spec/BPMN/20100524/MODEL\" xmlns:bpmndi=\"http://www.omg.org/spec/BPMN/20100524/DI\" xmlns:dc=\"http://www.omg.org/spec/DD/20100524/DC\" xmlns:di=\"http://www.omg.org/spec/DD/20100524/DI\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:zeebe=\"http://camunda.org/schema/zeebe/1.0\" exporter=\"camunda-token-cost-governor\" exporterVersion=\"0.2.0\" expressionLanguage=\"http://www.w3.org/1999/XPath\" id=\"Definitions_AiAgentTaskCostTracking\" targetNamespace=\"http://bpmn.io/schema/bpmn\" typeLanguage=\"http://www.w3.org/2001/XMLSchema\">\r\n    \r\n  <bpmn:error errorCode=\"PRICE_NOT_FOUND\" id=\"Error_PriceNotFound\" name=\"Price not found\"/>\r\n    \r\n  <!--\n    Each iteration of the AI Agent Task is followed by one Token Cost Reporter call that computes\n    that call's token count and USD cost, and accumulates it into totalCostMicros for the whole\n    process instance.\n\n    \"AI Agent Task\" here is a PLACEHOLDER service task (job type under the `demo.*` namespace),\n    standing in for Camunda's real io.camunda.agenticai:aiagent:task:2 element - substitute a real\n    one when adapting this example. Camunda's native AI Agent Task already reports token usage as\n    part of its own result (see README's token-accounting limitations note); this placeholder's\n    `agentResult` output stands in for that same shape (`agentResult.tokenUsage.inputTokens`/\n    `.outputTokens`, `agentResult.model`), which is exactly what Token Cost Reporter reads via\n    FEEL - no interception, no gateway, nothing between the AI Agent Task and the real provider.\n\n    The BoundaryEvent_PriceNotFound branch below is one illustrative way to handle an unpriced\n    model (logged and the loop ends) - it is not a required gate. Delete it, or let PRICE_NOT_FOUND\n    surface as an ordinary Zeebe incident instead, if you'd rather handle it differently.\n  -->\r\n    \r\n  <bpmn:process id=\"ai-agent-task-cost-tracking\" isClosed=\"false\" isExecutable=\"true\" name=\"AI Agent Task loop with token/cost tracking\" processType=\"None\">\r\n        \r\n    <bpmn:startEvent id=\"StartEvent_1\" isInterrupting=\"true\" name=\"Start\" parallelMultiple=\"false\">\r\n            \r\n      <bpmn:extensionElements>\r\n                \r\n        <zeebe:ioMapping>\r\n                    \r\n          <zeebe:output source=\"=0\" target=\"iterationCount\"/>\r\n                    \r\n          <zeebe:output source=\"=0\" target=\"totalCostMicros\"/>\r\n                  \r\n        </zeebe:ioMapping>\r\n              \r\n      </bpmn:extensionElements>\r\n            \r\n      <bpmn:outgoing>Flow_StartToAgent</bpmn:outgoing>\r\n          \r\n    </bpmn:startEvent>\r\n        \r\n    <bpmn:serviceTask completionQuantity=\"1\" id=\"Activity_AiAgentTask\" implementation=\"##WebService\" isForCompensation=\"false\" name=\"AI Agent Task (placeholder - see README)\" startQuantity=\"1\">\r\n            \r\n      <bpmn:extensionElements>\r\n                \r\n        <zeebe:taskDefinition retries=\"1\" type=\"demo.aiagent:task:1\"/>\r\n                \r\n        <zeebe:ioMapping>\r\n                    \r\n          <!-- Once any explicit zeebe:output mapping is present on a task, Zeebe stops\n               auto-propagating every job-returned variable to process scope and only merges\n               explicitly mapped ones - so continueLoop/agentResult must be listed here too, or\n               downstream expressions never see them (verified this the hard way via a failing\n               process test before adding this mapping). -->\r\n                    \r\n          <zeebe:output source=\"=iterationCount + 1\" target=\"iterationCount\"/>\r\n                    \r\n          <zeebe:output source=\"=continueLoop\" target=\"continueLoop\"/>\r\n                    \r\n          <zeebe:output source=\"=agentResult\" target=\"agentResult\"/>\r\n                  \r\n        </zeebe:ioMapping>\r\n              \r\n      </bpmn:extensionElements>\r\n            \r\n      <bpmn:incoming>Flow_StartToAgent</bpmn:incoming>\r\n            \r\n      <bpmn:incoming>Flow_LoopBackToAgent</bpmn:incoming>\r\n            \r\n      <bpmn:outgoing>Flow_AgentToTokenCost</bpmn:outgoing>\r\n          \r\n    </bpmn:serviceTask>\r\n        \r\n    <bpmn:serviceTask completionQuantity=\"1\" id=\"Activity_TokenCost\" implementation=\"##WebService\" isForCompensation=\"false\" name=\"Token cost\" startQuantity=\"1\">\r\n            \r\n      <bpmn:extensionElements>\r\n                \r\n        <zeebe:taskDefinition retries=\"1\" type=\"io.github.camunda:token-cost-governor:1\"/>\r\n                \r\n        <zeebe:ioMapping>\r\n                    \r\n          <zeebe:input source=\"&quot;anthropic&quot;\" target=\"provider\"/>\r\n                    \r\n          <zeebe:input source=\"=agentResult.model\" target=\"model\"/>\r\n                    \r\n          <zeebe:input source=\"=agentResult.tokenUsage.inputTokens\" target=\"inputTokens\"/>\r\n                    \r\n          <zeebe:input source=\"=agentResult.tokenUsage.outputTokens\" target=\"outputTokens\"/>\r\n                    \r\n          <zeebe:input source=\"&quot;{{secrets.GOVERNOR_PRICE_TABLE}}&quot;\" target=\"priceTableSecret\"/>\r\n                    \r\n          <zeebe:output source=\"=tokenCostResult\" target=\"tokenCostResult\"/>\r\n                    \r\n          <zeebe:output source=\"=totalCostMicros + tokenCostResult.costMicros\" target=\"totalCostMicros\"/>\r\n                  \r\n        </zeebe:ioMapping>\r\n                \r\n        <zeebe:taskHeaders>\r\n                    \r\n          <zeebe:header key=\"resultVariable\" value=\"tokenCostResult\"/>\r\n                    \r\n          <zeebe:header key=\"elementTemplateId\" value=\"io.github.camunda.TokenCostGovernor.v2\"/>\r\n                    \r\n          <zeebe:header key=\"elementTemplateVersion\" value=\"2\"/>\r\n                  \r\n        </zeebe:taskHeaders>\r\n              \r\n      </bpmn:extensionElements>\r\n            \r\n      <bpmn:incoming>Flow_AgentToTokenCost</bpmn:incoming>\r\n            \r\n      <bpmn:outgoing>Flow_TokenCostToGateway</bpmn:outgoing>\r\n          \r\n    </bpmn:serviceTask>\r\n        \r\n    <bpmn:boundaryEvent attachedToRef=\"Activity_TokenCost\" cancelActivity=\"true\" id=\"BoundaryEvent_PriceNotFound\" name=\"PRICE_NOT_FOUND\" parallelMultiple=\"false\">\r\n            \r\n      <bpmn:outgoing>Flow_BoundaryToLog</bpmn:outgoing>\r\n            \r\n      <bpmn:errorEventDefinition errorRef=\"Error_PriceNotFound\" id=\"ErrorEventDefinition_1\"/>\r\n          \r\n    </bpmn:boundaryEvent>\r\n        \r\n    <bpmn:serviceTask completionQuantity=\"1\" id=\"Activity_LogUnknownModelPrice\" implementation=\"##WebService\" isForCompensation=\"false\" name=\"Log unknown model price\" startQuantity=\"1\">\r\n            \r\n      <bpmn:extensionElements>\r\n                \r\n        <zeebe:taskDefinition retries=\"1\" type=\"demo.log:unknown-model-price:1\"/>\r\n              \r\n      </bpmn:extensionElements>\r\n            \r\n      <bpmn:incoming>Flow_BoundaryToLog</bpmn:incoming>\r\n            \r\n      <bpmn:outgoing>Flow_LogToEnd</bpmn:outgoing>\r\n          \r\n    </bpmn:serviceTask>\r\n        \r\n    <bpmn:exclusiveGateway default=\"Flow_ToDone\" gatewayDirection=\"Unspecified\" id=\"Gateway_Continue\" name=\"Continue looping?\">\r\n            \r\n      <bpmn:incoming>Flow_TokenCostToGateway</bpmn:incoming>\r\n            \r\n      <bpmn:outgoing>Flow_LoopBackToAgent</bpmn:outgoing>\r\n            \r\n      <bpmn:outgoing>Flow_ToDone</bpmn:outgoing>\r\n          \r\n    </bpmn:exclusiveGateway>\r\n        \r\n    <bpmn:sequenceFlow id=\"Flow_LoopBackToAgent\" name=\"agent wants another round\" sourceRef=\"Gateway_Continue\" targetRef=\"Activity_AiAgentTask\">\r\n            \r\n      <bpmn:conditionExpression xsi:type=\"bpmn:tFormalExpression\">=continueLoop = true and iterationCount &lt; 3</bpmn:conditionExpression>\r\n          \r\n    </bpmn:sequenceFlow>\r\n        \r\n    <bpmn:sequenceFlow id=\"Flow_ToDone\" name=\"done\" sourceRef=\"Gateway_Continue\" targetRef=\"EndEvent_Done\"/>\r\n        \r\n    <bpmn:endEvent id=\"EndEvent_Done\" name=\"Done\">\r\n            \r\n      <bpmn:incoming>Flow_ToDone</bpmn:incoming>\r\n          \r\n    </bpmn:endEvent>\r\n        \r\n    <bpmn:endEvent id=\"EndEvent_UnknownModelPrice\" name=\"Unknown model price\">\r\n            \r\n      <bpmn:incoming>Flow_LogToEnd</bpmn:incoming>\r\n          \r\n    </bpmn:endEvent>\r\n        \r\n    <bpmn:sequenceFlow id=\"Flow_StartToAgent\" sourceRef=\"StartEvent_1\" targetRef=\"Activity_AiAgentTask\"/>\r\n        \r\n    <bpmn:sequenceFlow id=\"Flow_AgentToTokenCost\" sourceRef=\"Activity_AiAgentTask\" targetRef=\"Activity_TokenCost\"/>\r\n        \r\n    <bpmn:sequenceFlow id=\"Flow_TokenCostToGateway\" sourceRef=\"Activity_TokenCost\" targetRef=\"Gateway_Continue\"/>\r\n        \r\n    <bpmn:sequenceFlow id=\"Flow_BoundaryToLog\" sourceRef=\"BoundaryEvent_PriceNotFound\" targetRef=\"Activity_LogUnknownModelPrice\"/>\r\n        \r\n    <bpmn:sequenceFlow id=\"Flow_LogToEnd\" sourceRef=\"Activity_LogUnknownModelPrice\" targetRef=\"EndEvent_UnknownModelPrice\"/>\r\n      \r\n  </bpmn:process>\r\n    \r\n  <bpmndi:BPMNDiagram id=\"BPMNDiagram_1\">\r\n        \r\n    <bpmndi:BPMNPlane bpmnElement=\"ai-agent-task-cost-tracking\" id=\"BPMNPlane_1\">\r\n            \r\n      <bpmndi:BPMNShape bpmnElement=\"StartEvent_1\" id=\"StartEvent_1_di\">\r\n                \r\n        <dc:Bounds height=\"36\" width=\"36\" x=\"152\" y=\"222\"/>\r\n              \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNShape bpmnElement=\"Activity_AiAgentTask\" id=\"Activity_AiAgentTask_di\">\r\n                \r\n        <dc:Bounds height=\"80\" width=\"100\" x=\"280\" y=\"200\"/>\r\n              \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNShape bpmnElement=\"Activity_TokenCost\" id=\"Activity_TokenCost_di\">\r\n                \r\n        <dc:Bounds height=\"80\" width=\"100\" x=\"440\" y=\"200\"/>\r\n              \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNShape bpmnElement=\"Gateway_Continue\" id=\"Gateway_Continue_di\" isMarkerVisible=\"true\">\r\n                \r\n        <dc:Bounds height=\"50\" width=\"50\" x=\"595\" y=\"215\"/>\r\n              \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNShape bpmnElement=\"EndEvent_Done\" id=\"EndEvent_Done_di\">\r\n                \r\n        <dc:Bounds height=\"36\" width=\"36\" x=\"702\" y=\"222\"/>\r\n              \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNShape bpmnElement=\"BoundaryEvent_PriceNotFound\" id=\"BoundaryEvent_PriceNotFound_di\">\r\n                \r\n        <dc:Bounds height=\"36\" width=\"36\" x=\"472\" y=\"262\"/>\r\n              \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNShape bpmnElement=\"Activity_LogUnknownModelPrice\" id=\"Activity_LogUnknownModelPrice_di\">\r\n                \r\n        <dc:Bounds height=\"80\" width=\"100\" x=\"440\" y=\"360\"/>\r\n              \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNShape bpmnElement=\"EndEvent_UnknownModelPrice\" id=\"EndEvent_UnknownModelPrice_di\">\r\n                \r\n        <dc:Bounds height=\"36\" width=\"36\" x=\"602\" y=\"382\"/>\r\n              \r\n      </bpmndi:BPMNShape>\r\n            \r\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_StartToAgent\" id=\"Flow_StartToAgent_di\">\r\n                \r\n        <di:waypoint x=\"188\" y=\"240\"/>\r\n                \r\n        <di:waypoint x=\"280\" y=\"240\"/>\r\n              \r\n      </bpmndi:BPMNEdge>\r\n            \r\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_AgentToTokenCost\" id=\"Flow_AgentToTokenCost_di\">\r\n                \r\n        <di:waypoint x=\"380\" y=\"240\"/>\r\n                \r\n        <di:waypoint x=\"440\" y=\"240\"/>\r\n              \r\n      </bpmndi:BPMNEdge>\r\n            \r\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_TokenCostToGateway\" id=\"Flow_TokenCostToGateway_di\">\r\n                \r\n        <di:waypoint x=\"540\" y=\"240\"/>\r\n                \r\n        <di:waypoint x=\"595\" y=\"240\"/>\r\n              \r\n      </bpmndi:BPMNEdge>\r\n            \r\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_ToDone\" id=\"Flow_ToDone_di\">\r\n                \r\n        <di:waypoint x=\"645\" y=\"240\"/>\r\n                \r\n        <di:waypoint x=\"702\" y=\"240\"/>\r\n              \r\n      </bpmndi:BPMNEdge>\r\n            \r\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_LoopBackToAgent\" id=\"Flow_LoopBackToAgent_di\">\r\n                \r\n        <di:waypoint x=\"620\" y=\"215\"/>\r\n                \r\n        <di:waypoint x=\"620\" y=\"120\"/>\r\n                \r\n        <di:waypoint x=\"330\" y=\"120\"/>\r\n                \r\n        <di:waypoint x=\"330\" y=\"200\"/>\r\n              \r\n      </bpmndi:BPMNEdge>\r\n            \r\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_BoundaryToLog\" id=\"Flow_BoundaryToLog_di\">\r\n                \r\n        <di:waypoint x=\"490\" y=\"298\"/>\r\n                \r\n        <di:waypoint x=\"490\" y=\"360\"/>\r\n              \r\n      </bpmndi:BPMNEdge>\r\n            \r\n      <bpmndi:BPMNEdge bpmnElement=\"Flow_LogToEnd\" id=\"Flow_LogToEnd_di\">\r\n                \r\n        <di:waypoint x=\"540\" y=\"400\"/>\r\n                \r\n        <di:waypoint x=\"602\" y=\"400\"/>\r\n              \r\n      </bpmndi:BPMNEdge>\r\n          \r\n    </bpmndi:BPMNPlane>\r\n      \r\n  </bpmndi:BPMNDiagram>\r\n  \r\n</bpmn:definitions>\r\n"

};</script><script defer="defer" src="./static/js/main.f3dab68b.js"></script><link href="./static/css/main.12702c6c.css" rel="stylesheet"></head><body><div id="root"></div></body></html>
